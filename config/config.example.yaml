# Copy to config/config.yaml (git-ignored) or point COMBO_ARB_CONFIG at this file.
# Secrets live in .env / environment, NOT here.

mode: paper            # paper | live   (paper simulates fills; live is triple-guarded)
environment: prod      # demo | prod    (selects the Kalshi API base URL)

strategy:
  # buy_underpriced: flag combos quoted BELOW fair -> buy the combo YES, hedge by
  #   shorting the legs. The buy-only trader's direction (you cannot sell/NO a combo).
  # sell_overpriced: flag combos quoted ABOVE fair -> sell the combo YES (as an RFQ
  #   maker), hedge by buying the legs. Requires being able to sell/quote the combo.
  direction: buy_underpriced   # buy_underpriced | sell_overpriced

pricing:
  prob_source: mid          # mid | last  — how a leg's marginal probability is estimated
  thin_book_spread: 0.10    # if (ask-bid) > this, fall back to last_trade for the leg prob
  correlation_factor: 1.0   # multiplies the product model; <1 shrinks, >1 lifts joint prob
  settlement_model: binary  # binary (product) | fractional (stub for future last-trade settlement)

fees:
  taker_rate: 0.07          # Kalshi taker coefficient: fee = ceil(rate*P*(1-P)*qty*100)/100
  maker_ratio: 0.25         # maker fee ~= 25% of taker
  min_fee_per_contract: 0.01

thresholds:
  buffer_abs: 0.01          # absolute $ buffer added on top of fees
  buffer_pct: 0.005         # OR 0.5% of fair value, whichever is larger
  min_margin: 0.0           # discard signals whose net margin is below this
  # On by default (auto-forced on when live is armed regardless). Without a buffer,
  # signals clearing fees by a fraction of a cent still execute and lose more often
  # than not once real fill prices, whole-contract hedge rounding, and the AND-rule's
  # negative convexity are accounted for.
  apply_buffer: true
  near_miss_band: 0.05      # persist non-flagged combos within this of the threshold
  # Reject a trade (signal-only) unless the pre-trade MODELLED full-package expected
  # PnL (combo + every hedge leg, real prices/fees, Monte-Carlo settlement) exceeds
  # this. Catches the gap between the scanner's per-contract combo edge (checked
  # before the hedge is sized/rounded) and the honest number.
  min_expected_pnl: 0.0

risk:
  capital_per_trade: 100.0  # max $ notional deployed per signal
  max_contracts_per_trade: 100
  max_position_per_market: 500   # abs net contracts per single leg/market
  max_total_exposure: 5000.0     # max aggregate $ notional across open positions
  max_open_signals: 25
  kill_switch: false             # if true, no new trades are executed
  # Trades are sized so every leg with |delta| above this gets >=1 whole hedge contract;
  # if that fully-hedged size doesn't fit capital/limits the combo is signal-only (never
  # executed partially hedged). Lower = hedge more legs (needs larger size); higher = allow
  # skipping tiny-delta legs so more combos trade.
  min_hedge_delta: 0.01
  # Reject a trade (signal-only) if any hedge leg's entry price would exceed this. A leg
  # priced near certainty buys little real hedge protection but still costs capital + fees.
  max_leg_price: 0.95
  # Max legs in a combo we'll trade. Each leg's hedge ratio is the product of the OTHER
  # legs' probabilities, which shrinks fast as legs are added -- past ~3 legs the fees on
  # N hedge legs exceed the protection they buy (measured: hedging is +EV at 2 legs,
  # ~breakeven at 3, negative at 5+), and "all but one leg hits" (the worst outcome) is
  # often the second most likely one. Combos with more legs are signal-only.
  max_legs: 3

execution:
  live_enabled: false       # HARD GUARD. Must be true (+ mode=live + CONFIRM_LIVE_TRADING=YES) to send real orders
  fill_model: taker_cross   # taker_cross | mid | depth_prob  (paper mode)
  combo_fill_price: yes_bid # price at which we (as maker) sell the overpriced combo YES
  # live-only:
  time_in_force: ioc        # ioc = fill-now-or-cancel (limits legging exposure)
  fill_poll_timeout_s: 5.0  # seconds to poll /portfolio/fills for reconciliation
  unwind_on_partial: true   # flatten a partially-filled hedged set back to zero
  require_balance_check: true
  max_trades_per_run: 0     # 0 = unlimited; set e.g. 1 for the first demo/live trade

discovery:
  source: rfq               # rfq (open RFQs only) | markets (enumerate all combo markets)
  # For markets mode, the combo series to enumerate (confirm for your account):
  series_tickers: []        # e.g. [KXMVESPORTSMULTIGAMEEXTENDED, KXMVECROSSCATEGORY]
  market_status: open

polling:
  interval_ms: 1000         # scanner poll cadence
  max_requests_per_sec: 8   # client-side rate limit
  max_combos_per_scan: 25   # cap combos priced per scan (each = 1 combo + N leg reads)
  leg_cache_ttl_ms: 0       # 0 = always fetch legs fresh (no stale reuse); >0 = reuse window

persistence:
  db_path: data/combo_arb.db

settlement_sim:
  n_scenarios: 2000         # Monte-Carlo draws for paper PnL realization
  seed: 42

settlement:
  check_interval_s: 30.0    # how often to poll open trades' legs for real resolution
  # A trade older than this with an un-fetchable (delisted/rolled-off) leg is marked
  # "expired" so it stops holding a risk slot forever. Only errored legs trigger it;
  # a leg that fetches fine but isn't resolved yet keeps the trade open. 0 disables.
  max_open_age_s: 86400.0   # 24h
